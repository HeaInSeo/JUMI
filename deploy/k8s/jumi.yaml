apiVersion: v1
kind: ServiceAccount
metadata:
  name: jumi
imagePullSecrets:
  - name: harbor-regcred
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jumi
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jumi
subjects:
  - kind: ServiceAccount
    name: jumi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jumi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jumi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jumi
  template:
    metadata:
      labels:
        app: jumi
    spec:
      serviceAccountName: jumi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jumi
          image: jumi-image:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: JUMI_HTTP_ADDR
              value: ":8080"
            - name: JUMI_GRPC_ADDR
              value: ":9090"
            - name: JUMI_NAMESPACE
              value: "jumi-ah-dev"
            - name: JUMI_AH_URL
              value: "http://artifact-handoff.jumi-ah-dev.svc.cluster.local:8080"
            - name: JUMI_AH_GRPC_TARGET
              value: "artifact-handoff.jumi-ah-dev.svc.cluster.local:9090"
            # JUMI_REGISTRY_PATH points the durable SQLite registry at the
            # writable /data mount below. readOnlyRootFilesystem: true makes the
            # container CWD read-only, so the default (jumi-registry.db in CWD)
            # would fail at SQLite init; this path lives on the mounted volume.
            - name: JUMI_REGISTRY_PATH
              value: "/data/jumi-registry.db"
          volumeMounts:
            # Writable durable-registry mount. Required because the root
            # filesystem is read-only (readOnlyRootFilesystem: true).
            - name: jumi-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jumi-data
          # emptyDir: the durable registry survives container restarts within the
          # same Pod, but is lost when the Pod is rescheduled. Replace with a
          # PersistentVolumeClaim (operator-provisioned) for durability across
          # Pod rescheduling in production.
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jumi
spec:
  selector:
    app: jumi
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
