name: Test

# No paths-ignore: always triggers so required checks report a status.
# Docs-only changes are detected in-job and work is skipped (green). (#29)
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.7

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: ./.github/actions/detect-docs-only

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate GitHub Actions workflows
        if: steps.changes.outputs.docs_only != 'true'
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  test:
    name: Unit Regression And Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: ./.github/actions/detect-docs-only

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go mod tidy
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Prepare local replacements
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          if grep -R "=> ../../../kube-slint" tools >/dev/null 2>&1; then
            if [ ! -d ../kube-slint/.git ]; then
              git clone --depth 1 https://github.com/HeaInSeo/kube-slint ../kube-slint
            fi
          fi

      - name: Verify nested module go.mod/go.sum are tidy
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          for mod in tools/jumi-smoke tools/kubeslint-smoke-summary; do
            (cd "$mod" && go mod tidy)
          done
          git diff --exit-code -- tools/jumi-smoke/go.mod tools/jumi-smoke/go.sum \
            tools/kubeslint-smoke-summary/go.mod tools/kubeslint-smoke-summary/go.sum
          test -z "$(git status --porcelain -- tools/jumi-smoke/go.mod tools/jumi-smoke/go.sum \
            tools/kubeslint-smoke-summary/go.mod tools/kubeslint-smoke-summary/go.sum)"

      - name: Clone artifact-handoff (proto sync source of truth)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          if [ ! -d ../artifact-handoff/.git ]; then
            git clone --depth 1 https://github.com/HeaInSeo/artifact-handoff ../artifact-handoff
          fi

      - name: Verify handoff proto is in sync with artifact-handoff
        if: steps.changes.outputs.docs_only != 'true'
        run: make handoff-proto-sync-check AH_REPO_ROOT="${{ github.workspace }}/../artifact-handoff"

      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: make test

      - name: Run regression suite
        if: steps.changes.outputs.docs_only != 'true'
        run: make test-regression

      - name: Run dependency license guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make license-check

      - name: Run vulnerability guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make vuln-check

      - name: Run gosec security guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint-security-check

      - name: Generate coverage report and enforce threshold
        if: steps.changes.outputs.docs_only != 'true'
        run: make coverage-check

      - name: Check no fmt drift
        if: steps.changes.outputs.docs_only != 'true'
        run: git diff --exit-code '*.go'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: jumi-coverage
          path: reports/
