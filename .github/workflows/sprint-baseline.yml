name: Sprint Baseline

# No paths-ignore: always triggers so the required check "JUMI AH nan contract
# baseline" reports a status. Docs-only changes are detected in-job and the
# cross-repo checkouts + baseline are skipped (green). (#29)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sprint-baseline:
    name: JUMI AH nan contract baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JUMI
        uses: actions/checkout@v7
        with:
          path: JUMI
          fetch-depth: 0

      # Inline detect (not the composite action): JUMI is checked out under a
      # subdir here, so git runs with working-directory: JUMI.
      - name: Detect docs-only change
        id: changes
        working-directory: JUMI
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base commit unavailable — running full checks"
            exit 0
          fi
          # --no-renames so a code→*.md rename is not misread as docs-only
          # (see .github/actions/detect-docs-only; NodeVault#87).
          changed="$(git diff --no-renames --name-only "$base" "$head")"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^LICENSE(\.[^/]*)?$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "non-doc files changed — running checks"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "docs-only change — skipping cross-repo baseline, reporting success"
          fi

      - name: Checkout artifact-handoff
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
        with:
          repository: HeaInSeo/artifact-handoff
          path: artifact-handoff
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout node-artifact-runtime
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
        with:
          repository: HeaInSeo/node-artifact-runtime
          path: node-artifact-runtime
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: JUMI/go.mod

      - name: Run cross-repo sprint baseline
        if: steps.changes.outputs.docs_only != 'true'
        working-directory: JUMI
        env:
          AH_REPO_ROOT: ${{ github.workspace }}/artifact-handoff
          NAN_REPO_ROOT: ${{ github.workspace }}/node-artifact-runtime
        run: make verify-sprint-3d-baseline
